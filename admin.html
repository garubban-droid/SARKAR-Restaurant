<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI EXPRESS BIRYANI · Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fffaf0;color:#2b1a0b}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border:1px solid #eadfc8;border-radius:16px;padding:14px;box-shadow:0 5px 16px #0000000d;margin:10px 0}.metric{font-size:28px;font-weight:900}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#b98117;color:#fff}.tabs button.secondary,button.secondary{background:#f2e4c8;color:#5e400c}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}input,select,textarea{width:100%;padding:10px;border:1px solid #dfd1b7;border-radius:9px;box-sizing:border-box;margin:5px 0 8px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee3d2;text-align:left;vertical-align:top}.pill{padding:4px 8px;border-radius:999px;background:#eaf7ee;color:#087b4d;font-weight:800}.hidden{display:none!important}.danger{background:#a53127!important}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="wrap"><div class="top"><div class="brand">🍛 MI EXPRESS BIRYANI · Admin</div><button class="secondary" onclick="logout()">Logout</button></div><div id="login" class="card"><h2>Admin Login</h2><input id="adminPassword" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button><p id="loginMsg"></p></div><div id="app" class="hidden"><div id="metrics" class="grid"></div><div class="tabs"><button onclick="tab('orders')">Orders</button><button onclick="tab('products')">Menu</button><button onclick="tab('coupons')">Coupons</button><button onclick="tab('riders')">Riders</button><button onclick="tab('settings')">Settings</button></div><div id="panel"></div></div></div><script>
let key=localStorage.getItem('mebAdminKey')||'';let data=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key,'content-type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{const p=document.getElementById('adminPassword').value;const d=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});const x=await d.json();if(!d.ok)throw Error(x.error);key=x.adminKey;localStorage.setItem('mebAdminKey',key);await load();}catch(e){document.getElementById('loginMsg').textContent=e.message}}
function logout(){localStorage.removeItem('mebAdminKey');location.reload()}
async function load(){try{data=await api('/api/admin/dashboard');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');metrics();tab('orders')}catch(e){logout()}}
function metrics(){const c=data.counts;document.getElementById('metrics').innerHTML=Object.entries(c).map(([k,v])=>`<div class="card"><div>${esc(k)}</div><div class="metric">${v}</div></div>`).join('')}
function tab(t){if(t==='orders')orders();if(t==='products')products();if(t==='coupons')coupons();if(t==='riders')riders();if(t==='settings')settings()}
function orders(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Orders</h2><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Rider</th><th>Action</th></tr>${data.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><br>${new Date(o.createdAt).toLocaleString('en-IN')}</td><td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address)}</td><td>₹${o.total}<br><small>${esc(o.paymentMethod)} · ${esc(o.paymentStatus)}</small></td><td><span class="pill">${esc(o.status)}</span></td><td>${esc(o.assignedRiderId||'Unassigned')}</td><td><select id="st_${esc(o.id)}"><option>${esc(o.status)}</option><option>Confirmed</option><option>Preparing</option><option>Ready for Pickup</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><button onclick="status('${esc(o.id)}')">Update</button><select id="rd_${esc(o.id)}"><option value="">Assign rider</option>${data.riders.filter(r=>r.active).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="secondary" onclick="assign('${esc(o.id)}')">Assign</button></td></tr>`).join('')}</table></div>`}
async function status(id){await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:document.getElementById('st_'+id).value})});await load()}
async function assign(id){const riderId=document.getElementById('rd_'+id).value;if(!riderId)return;await api('/api/admin/assign-rider/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({riderId})});await load()}
function products(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Menu Products</h2><div class="row"><input id="pn" placeholder="Bengali name"><input id="pe" placeholder="English name"><input id="pc" placeholder="Category"><input id="pp" type="number" placeholder="Price"></div><textarea id="pd" placeholder="Description"></textarea><input id="pi" placeholder="Image URL"><input id="pv" placeholder="Video/YouTube URL"><button onclick="saveProduct()">Save / Publish</button></div><div class="card"><table><tr><th>Name</th><th>Price</th><th>Published</th><th>Action</th></tr>${data.products.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.en)}</small></td><td>₹${p.price}</td><td>${p.published?'Yes':'No'}</td><td><button onclick='editProduct(${JSON.stringify(p).replaceAll("'","&#39;")})'>Edit</button> <button class="danger" onclick="delProduct('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>`}
function editProduct(p){['pn','pe','pc','pp','pd','pi','pv'].forEach((id,i)=>document.getElementById(id).value=[p.name,p.en,p.category,p.price,p.desc,p.image,p.video][i]||'');window.editPid=p.id}
async function saveProduct(){const b={id:window.editPid,name:pn.value,en:pe.value,category:pc.value,price:Number(pp.value),desc:pd.value,image:pi.value,video:pv.value,published:true};await api('/api/admin/products',{method:'POST',body:JSON.stringify(b)});window.editPid=null;await load()}
async function delProduct(id){if(!confirm('Delete product?'))return;await api('/api/admin/products/'+id,{method:'DELETE'});await load()}
function coupons(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Create / Publish Coupon</h2><div class="row"><input id="cc" placeholder="CODE"><input id="cd" placeholder="Description"><select id="ct"><option value="FIXED">Fixed ₹</option><option value="PERCENT">Percent %</option><option value="FREE_DELIVERY">Free Delivery</option></select><input id="cv" type="number" placeholder="Value"><input id="cm" type="number" placeholder="Minimum order"><input id="cx" type="number" placeholder="Max discount"></div><div class="row"><input id="ce" type="datetime-local" placeholder="Expiry"><input id="cl" type="number" placeholder="Usage limit"></div><button onclick="saveCoupon()">Save & Publish</button></div><div class="card"><table><tr><th>Code</th><th>Description</th><th>Discount</th><th>Status</th><th>Action</th></tr>${data.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.description)}</td><td>${esc(c.discount_type)} ${c.discount_value}</td><td>${c.published?'Published':'Draft'}</td><td><button class="danger" onclick="delCoupon('${c.id}')">Delete</button></td></tr>`).join('')}</table></div>`}
async function saveCoupon(){await api('/api/admin/coupons',{method:'POST',body:JSON.stringify({code:cc.value,description:cd.value,discountType:ct.value,discountValue:Number(cv.value),minOrder:Number(cm.value||0),maxDiscount:cx.value?Number(cx.value):null,expiresAt:ce.value?new Date(ce.value).toISOString():null,usageLimit:cl.value?Number(cl.value):null,published:true})});await load()}
async function delCoupon(id){if(confirm('Delete coupon?')){await api('/api/admin/coupons/'+id,{method:'DELETE'});await load()}}
function riders(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Add Rider</h2><div class="row"><input id="rn" placeholder="Name"><input id="rp" placeholder="Phone"><input id="rpass" type="password" placeholder="Password"></div><button onclick="saveRider()">Create Rider</button></div><div class="card"><table><tr><th>Name</th><th>Phone</th><th>Active</th><th>GPS</th></tr>${data.riders.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${r.active?'Yes':'No'}</td><td>${r.latitude??'--'}, ${r.longitude??'--'}<br>${r.last_seen||''}</td></tr>`).join('')}</table></div>`}
async function saveRider(){await api('/api/admin/riders',{method:'POST',body:JSON.stringify({name:rn.value,phone:rp.value,password:rpass.value})});await load()}
function settings(){const s=dataSettings||{};document.getElementById('panel').innerHTML=`<div class="card"><h2>Restaurant Settings</h2><div class="row"><input id="df" type="number" value="${s.deliveryFee||0}" placeholder="Delivery fee"><input id="ot" value="${esc(s.openingTime||'10:00 AM')}" placeholder="Opening"><input id="clt" value="${esc(s.closingTime||'9:00 PM')}" placeholder="Closing"><input id="dr" type="number" value="${s.deliveryRadiusKm||10}" placeholder="Delivery radius km"></div><button onclick="saveSettings()">Save Settings</button></div>`;}
let dataSettings={};async function refreshSettings(){dataSettings=await fetch('/api/settings').then(r=>r.json())}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({...dataSettings,deliveryFee:Number(df.value),openingTime:ot.value,closingTime:clt.value,deliveryRadiusKm:Number(dr.value)})});await load()}
refreshSettings();if(key)load();
</script></body></html>
