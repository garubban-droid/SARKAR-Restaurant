<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI EXPRESS BIRYANI · Admin Control Center</title><style>
:root{--bg:#fffaf0;--card:#fff;--line:#eadfc8;--ink:#2b1a0b;--gold:#b98117;--soft:#f2e4c8;--red:#a53127;--green:#087b4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1280px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:5;padding:6px 0}.brand{font-size:22px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 5px 16px #0000000d}.metric{font-size:26px;font-weight:900}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0;position:sticky;top:48px;background:var(--bg);padding:7px 0;z-index:4}.tabs button,button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--gold);color:#fff}.tabs button.secondary,button.secondary{background:var(--soft);color:#5e400c}.danger{background:var(--red)!important}.green{background:var(--green)!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,select,textarea{width:100%;padding:10px;border:1px solid #dfd1b7;border-radius:9px;margin:5px 0 8px;font:inherit}textarea{min-height:120px;resize:vertical}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee3d2;text-align:left;vertical-align:top}.pill{padding:4px 8px;border-radius:999px;background:#eaf7ee;color:#087b4d;font-weight:800}.muted{color:#766b5d}.hidden{display:none!important}.section-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.smallbtn{padding:7px 9px;font-size:12px}.danger-text{color:var(--red)}.ok-text{color:var(--green)}.json{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;min-height:240px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search{max-width:360px}.notice{background:#fff6dc;border:1px solid #ead19b;border-radius:12px;padding:10px;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto;white-space:nowrap}.brand{font-size:18px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">🍛 MI EXPRESS BIRYANI · A-Z ADMIN CONTROL</div><button class="secondary" onclick="logout()">Logout</button></div>
<div id="login" class="card"><h2>Admin Login</h2><p class="muted">Central control for Customer App + Rider App + orders + content + settings.</p><input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username"><input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="login()">Sign in</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><div id="metrics" class="grid"></div><div class="tabs"><button onclick="tab('overview')">Overview</button><button onclick="tab('app')">App Control</button><button onclick="tab('orders')">Orders</button><button onclick="tab('products')">Menu</button><button onclick="tab('coupons')">Coupons</button><button onclick="tab('customers')">Customers</button><button onclick="tab('riders')">Riders</button><button onclick="tab('referrals')">Referrals</button></div><div id="panel"></div></div></div>
<script>
let key=localStorage.getItem('mebAdminKey')||'',data=null,editProductId=null,editCouponId=null,editRiderId=null,editCustomerId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key,'content-type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{const email=adminEmail.value.trim();const p=adminPassword.value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error);key=d.adminKey;localStorage.setItem('mebAdminKey',key);await load()}catch(e){loginMsg.textContent=e.message}}
function logout(){localStorage.removeItem('mebAdminKey');location.reload()}
async function load(){try{data=await api('/api/admin/dashboard');login.classList.add('hidden');app.classList.remove('hidden');metrics();tab('overview')}catch(e){localStorage.removeItem('mebAdminKey');location.reload()}}
function metrics(){const c=data.counts;metricsEl=document.getElementById('metrics');metricsEl.innerHTML=Object.entries(c).map(([k,v])=>`<div class="card"><div>${esc(k)}</div><div class="metric">${v}</div></div>`).join('')}
function tab(t){({overview,app:appControl,orders,products,coupons,customers,riders,referrals}[t]||overview)()}
function overview(){document.getElementById('panel').innerHTML=`<div class="card"><div class="section-title"><h2>Control Center</h2><button onclick="load()">Refresh All</button></div><div class="notice">Everything below is server-backed. Changes made here are reflected in the Customer App or Rider App after refresh/reload.</div><div class="split"><div><h3>Customer App</h3><p>Brand, hero, ticker, menu, profile sections, policies/content, delivery settings, referral reward, coupons and restaurant status.</p></div><div><h3>Rider App</h3><p>Rider accounts, active/inactive access, password, assigned orders, order status and live GPS visibility.</p></div></div></div>`;bindMediaPreview();}
function appControl(){const s=data.settings||{};document.getElementById('panel').innerHTML=`<div class="card"><div class="section-title"><h2>Customer App — Visual & Business Control</h2><button onclick="load()">Reload</button></div><div class="row"><input id="brandBn" value="${esc(s.brandBn||'MI EXPRESS BIRYANI')}" placeholder="Brand Bengali"><input id="brandEn" value="${esc(s.brandEn||'MI EXPRESS BIRYANI')}" placeholder="Brand English"><input id="appVersion" value="${esc(s.appVersion||'1.0.0')}" placeholder="App version"><input id="supportEmail" value="${esc(s.supportEmail||'miexpressbiryani12@gmail.com')}" placeholder="Support email"></div><div class="row"><input id="address" value="${esc(s.address||'')}" placeholder="Address"><input id="addressEn" value="${esc(s.addressEn||'')}" placeholder="Address English"><input id="deliveryFee" type="number" value="${Number(s.deliveryFee||0)}" placeholder="Delivery fee"><input id="deliveryRadiusKm" type="number" value="${Number(s.deliveryRadiusKm||10)}" placeholder="Delivery radius km"></div><div class="row"><input id="openingTime" value="${esc(s.openingTime||'10:00 AM')}" placeholder="Opening time"><input id="closingTime" value="${esc(s.closingTime||'9:00 PM')}" placeholder="Closing time"><input id="referralReward" type="number" value="${Number(s.referralReward||50)}" placeholder="Referral reward"><select id="open"><option value="1" ${s.open!==false?'selected':''}>Restaurant OPEN</option><option value="0" ${s.open===false?'selected':''}>Restaurant CLOSED</option></select></div><div class="row"><input id="heroTitle" value="${esc(s.heroTitle||'')}" placeholder="Hero title"><input id="heroSub" value="${esc(s.heroSub||'')}" placeholder="Hero subtitle"><input id="heroButton" value="${esc(s.heroButton||'')}" placeholder="Hero button"><input id="heroImage" value="${esc(s.heroImage||'')}" placeholder="Hero image URL"></div><div class="row"><input id="popularTitle" value="${esc(s.popularTitle||'')}" placeholder="Popular title"><input id="popularSub" value="${esc(s.popularSub||'')}" placeholder="Popular subtitle"><input id="menuTitle" value="${esc(s.menuTitle||'')}" placeholder="Menu title"><input id="menuSub" value="${esc(s.menuSub||'')}" placeholder="Menu subtitle"></div><textarea id="ticker" placeholder="One ticker line per row">${esc(Array.isArray(s.ticker)?s.ticker.join('\n'):s.ticker||'')}</textarea><button onclick="saveVisualSettings()">Save & Publish App Settings</button></div>
<div class="card"><div class="section-title"><h2>Profile & Legal / Help Content</h2><button class="secondary" onclick="formatJsonEditors()">Format JSON</button></div><p class="muted">Edit these JSON blocks to add, remove, reorder, publish/unpublish or rewrite Customer App profile cards, policies, help pages and other sections. Existing UI remains intact.</p><div class="split"><div><label><b>profileSetup JSON</b></label><textarea id="profileSetupJson" class="json">${esc(JSON.stringify(s.profileSetup||{},null,2))}</textarea></div><div><label><b>moreOptions JSON</b></label><textarea id="moreOptionsJson" class="json">${esc(JSON.stringify(s.moreOptions||[],null,2))}</textarea></div></div><button onclick="saveContentSettings()">Save & Publish Content</button></div>
<div class="card"><div class="section-title"><h2>Advanced A-Z Settings</h2><span class="muted">Full settings object</span></div><textarea id="fullSettingsJson" class="json">${esc(JSON.stringify(s,null,2))}</textarea><button onclick="saveFullSettings()">Save Full Settings</button></div>`;bindMediaPreview();}
function baseSettings(){const s={...(data.settings||{})};s.brandBn=brandBn.value;s.brandEn=brandEn.value;s.appVersion=appVersion.value;s.supportEmail=supportEmail.value;s.address=address.value;s.addressEn=addressEn.value;s.deliveryFee=Number(deliveryFee.value||0);s.deliveryRadiusKm=Number(deliveryRadiusKm.value||0);s.openingTime=openingTime.value;s.closingTime=closingTime.value;s.referralReward=Number(referralReward.value||0);s.open=open.value==='1';s.heroTitle=heroTitle.value;s.heroSub=heroSub.value;s.heroButton=heroButton.value;s.heroImage=heroImage.value;s.popularTitle=popularTitle.value;s.popularSub=popularSub.value;s.menuTitle=menuTitle.value;s.menuSub=menuSub.value;s.ticker=ticker.value.split('\n').map(x=>x.trim()).filter(Boolean);return s}
async function saveVisualSettings(){try{const s=baseSettings();await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(s)});await load();alert('App settings published.')}catch(e){alert(e.message)}}
async function saveContentSettings(){try{const s={...data.settings,profileSetup:JSON.parse(profileSetupJson.value),moreOptions:JSON.parse(moreOptionsJson.value)};await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(s)});await load();alert('Content published.')}catch(e){alert('Invalid JSON: '+e.message)}}
async function saveFullSettings(){try{const s=JSON.parse(fullSettingsJson.value);await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(s)});await load();alert('Full settings saved.')}catch(e){alert('Invalid JSON or save failed: '+e.message)}}
function formatJsonEditors(){try{profileSetupJson.value=JSON.stringify(JSON.parse(profileSetupJson.value),null,2);moreOptionsJson.value=JSON.stringify(JSON.parse(moreOptionsJson.value),null,2);fullSettingsJson.value=JSON.stringify(JSON.parse(fullSettingsJson.value),null,2)}catch(e){alert('One JSON block is invalid.')}}
function orders(){document.getElementById('panel').innerHTML=`<div class="card"><div class="toolbar"><h2>Orders</h2><input id="orderSearch" class="search" placeholder="Search order/customer/phone" oninput="filterRows('ordersTable',this.value)"></div><table id="ordersTable"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Rider</th><th>Actions</th></tr>${data.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><br>${new Date(o.createdAt).toLocaleString('en-IN')}</td><td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address)}</td><td>₹${o.total}<br><small>${esc(o.paymentMethod)} · ${esc(o.paymentStatus)}</small></td><td><span class="pill">${esc(o.status)}</span></td><td>${esc(o.assignedRiderId||'Unassigned')}</td><td><select id="st_${esc(o.id)}"><option>${esc(o.status)}</option><option>Confirmed</option><option>Preparing</option><option>Ready for Pickup</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><button class="smallbtn" onclick="status('${esc(o.id)}')">Update</button><select id="rd_${esc(o.id)}"><option value="">Assign rider</option>${data.riders.filter(r=>r.active).map(r=>`<option value="${r.id}" ${r.id===o.assignedRiderId?'selected':''}>${esc(r.name)}</option>`).join('')}</select><button class="smallbtn secondary" onclick="assign('${esc(o.id)}')">Assign</button> <button class="smallbtn danger" onclick="delOrder('${esc(o.id)}')">Delete</button></td></tr>`).join('')}</table></div>`;bindMediaPreview();}
function filterRows(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach((tr,i)=>{if(!i) return;tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}
async function status(id){try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:document.getElementById('st_'+id).value})});await load()}catch(e){alert(e.message)}}
async function assign(id){const riderId=document.getElementById('rd_'+id).value;if(!riderId)return;try{await api('/api/admin/assign-rider/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({riderId})});await load()}catch(e){alert(e.message)}}
async function delOrder(id){if(confirm('Delete this order permanently?')){await api('/api/admin/orders/'+encodeURIComponent(id),{method:'DELETE'});await load()}}
function mediaPreview(p){
  const img=p.image?`<img src="${esc(p.image)}" onerror="this.style.display='none'" style="width:70px;height:55px;object-fit:cover;border-radius:8px">`:'';
  const vid=p.video?`<video src="${esc(p.video)}" muted autoplay loop playsinline preload="metadata" style="width:90px;height:55px;object-fit:cover;border-radius:8px" onerror="this.style.display='none'"></video>`:'';
  return img+vid;
}
function normalizeMediaUrl(v){const x=String(v||'').trim(); if(!x)return ''; if(/youtube\.com|youtu\.be/.test(x)){const m=x.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/); return m?`https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&loop=1&playlist=${m[1]}&playsinline=1`:x;} return x;}
function products(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Menu / Products</h2><div class="row"><input id="pn" placeholder="Bengali name"><input id="pe" placeholder="English name"><input id="pc" placeholder="Category"><input id="pp" type="number" placeholder="Price"></div><textarea id="pd" placeholder="Description"></textarea><div id="mediaPreview" style="display:flex;gap:8px;min-height:10px;margin:4px 0"></div><input id="pi" placeholder="Photo URL — paste link, auto set"><input id="pv" placeholder="Video URL / YouTube link — auto play"><select id="pub"><option value="1">Published</option><option value="0">Draft / Hidden</option></select><button onclick="saveProduct()">Save Product</button></div><div class="card"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Action</th></tr>${data.products.map(p=>`<tr><td>${mediaPreview(p)}</td><td>${esc(p.name)}<br><small>${esc(p.en)}</small></td><td>${esc(p.category)}</td><td>₹${p.price}</td><td>${p.published?'Published':'Draft'}</td><td><button class="smallbtn" onclick='editProduct(${JSON.stringify(p).replaceAll("'","&#39;")})'>Edit</button> <button class="smallbtn secondary" onclick="toggleProduct('${p.id}',${!p.published})">${p.published?'Unpublish':'Publish'}</button> <button class="smallbtn danger" onclick="delProduct('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>`;bindMediaPreview();}
function bindMediaPreview(){['pi','pv'].forEach(id=>document.getElementById(id)?.addEventListener('input',previewMediaFields));}
function editProduct(p){['pn','pe','pc','pp','pd','pi','pv'].forEach((id,i)=>document.getElementById(id).value=[p.name,p.en,p.category,p.price,p.desc,p.image,p.video][i]||'');pub.value=p.published?'1':'0';editProductId=p.id;window.scrollTo({top:0,behavior:'smooth'})}
function previewMediaFields(){
 const box=document.getElementById('mediaPreview'); if(!box)return; const image=String(document.getElementById('pi')?.value||'').trim(); const video=normalizeMediaUrl(document.getElementById('pv')?.value||'');
 box.innerHTML=(image?`<img src="${esc(image)}" style="width:90px;height:70px;object-fit:cover;border-radius:10px" onerror="this.alt='Image URL invalid'">`: '')+(video?`<video src="${esc(video)}" muted autoplay loop playsinline controls preload="metadata" style="width:120px;height:70px;object-fit:cover;border-radius:10px"></video>`:'');
}
async function saveProduct(){await api('/api/admin/products',{method:'POST',body:JSON.stringify({id:editProductId,name:pn.value,en:pe.value,category:pc.value,price:Number(pp.value),desc:pd.value,image:pi.value.trim(),video:normalizeMediaUrl(pv.value),published:pub.value==='1'})});editProductId=null;await load()}
async function toggleProduct(id,published){await api('/api/admin/products/'+id,{method:'PATCH',body:JSON.stringify({published})});await load()}
async function delProduct(id){if(confirm('Delete product?')){await api('/api/admin/products/'+id,{method:'DELETE'});await load()}}
function coupons(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Create / Edit / Publish Coupon</h2><div class="row"><input id="cc" placeholder="CODE"><input id="cd" placeholder="Description"><select id="ct"><option value="FIXED">Fixed ₹</option><option value="PERCENT">Percent %</option><option value="FREE_DELIVERY">Free Delivery</option></select><input id="cv" type="number" placeholder="Value"><input id="cm" type="number" placeholder="Minimum order"><input id="cx" type="number" placeholder="Max discount"></div><div class="row"><input id="ce" type="datetime-local"><input id="cl" type="number" placeholder="Usage limit"><select id="cpub"><option value="1">Published</option><option value="0">Draft</option></select></div><button onclick="saveCoupon()">Save Coupon</button></div><div class="card"><table><tr><th>Code</th><th>Description</th><th>Discount</th><th>Status</th><th>Action</th></tr>${data.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.description)}</td><td>${esc(c.discount_type)} ${c.discount_value}</td><td>${c.published?'Published':'Draft'}</td><td><button class="smallbtn" onclick='editCoupon(${JSON.stringify(c).replaceAll("'","&#39;")})'>Edit</button> <button class="smallbtn secondary" onclick="toggleCoupon('${c.id}',${!c.published})">${c.published?'Unpublish':'Publish'}</button> <button class="smallbtn danger" onclick="delCoupon('${c.id}')">Delete</button></td></tr>`).join('')}</table></div>`;bindMediaPreview();}
function editCoupon(c){cc.value=c.code;cd.value=c.description||'';ct.value=c.discount_type;cv.value=c.discount_value;cm.value=c.min_order||0;cx.value=c.max_discount??'';cl.value=c.usage_limit??'';cpub.value=c.published?'1':'0';ce.value=c.expires_at?new Date(c.expires_at).toISOString().slice(0,16):'';editCouponId=c.id;window.scrollTo({top:0,behavior:'smooth'})}
async function saveCoupon(){const body={id:editCouponId,code:cc.value,description:cd.value,discountType:ct.value,discountValue:Number(cv.value),minOrder:Number(cm.value||0),maxDiscount:cx.value?Number(cx.value):null,expiresAt:ce.value?new Date(ce.value).toISOString():null,usageLimit:cl.value?Number(cl.value):null,published:cpub.value==='1'};await api('/api/admin/coupons',{method:'POST',body:JSON.stringify(body)});editCouponId=null;await load()}
async function toggleCoupon(id,published){await api('/api/admin/coupons/'+id,{method:'PATCH',body:JSON.stringify({published})});await load()}
async function delCoupon(id){if(confirm('Delete coupon?')){await api('/api/admin/coupons/'+id,{method:'DELETE'});await load()}}
function customers(){document.getElementById('panel').innerHTML=`<div class="card"><div class="toolbar"><h2>Customers</h2><input class="search" placeholder="Search name/phone" oninput="filterRows('customersTable',this.value)"></div><table id="customersTable"><tr><th>Customer</th><th>Phone</th><th>Email</th><th>Referral</th><th>Balance</th><th>Action</th></tr>${data.customers.map(c=>`<tr><td>${esc(c.name)}<br><small>${esc(c.gender||'')} · ${esc(c.dateOfBirth||'')}</small></td><td>${esc(c.phone)}</td><td>${esc(c.email||'')}</td><td>${esc(c.referralCode||'')}</td><td>₹${Number(c.promotionalBalance||0)}</td><td><button class="smallbtn" onclick='editCustomer(${JSON.stringify(c).replaceAll("'","&#39;")})'>Edit</button> <button class="smallbtn danger" onclick="delCustomer('${c.id}')">Delete</button></td></tr>`).join('')}</table></div>`;bindMediaPreview();}
function editCustomer(c){document.getElementById('panel').insertAdjacentHTML('afterbegin',`<div class="card"><h3>Edit Customer</h3><div class="row"><input id="ecn" value="${esc(c.name)}" placeholder="Name"><input id="ece" value="${esc(c.email||'')}" placeholder="Email"><input id="ecg" value="${esc(c.gender||'')}" placeholder="Gender"><input id="ecd" value="${esc(c.dateOfBirth||'')}" placeholder="DOB"><input id="ecb" type="number" value="${Number(c.promotionalBalance||0)}" placeholder="Promotional balance"></div><button onclick="saveCustomer('${c.id}')">Save Customer</button></div>`)}
async function saveCustomer(id){await api('/api/admin/customers/'+id,{method:'PATCH',body:JSON.stringify({name:ecn.value,email:ece.value,gender:ecg.value,dateOfBirth:ecd.value,promotionalBalance:Number(ecb.value||0)})});await load()}
async function delCustomer(id){if(confirm('Delete this customer account permanently?')){await api('/api/admin/customers/'+id,{method:'DELETE'});await load()}}
function riders(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Create / Edit Rider</h2><div class="row"><input id="rn" placeholder="Name"><input id="rp" placeholder="Phone"><input id="rpass" type="password" placeholder="New password (leave blank when editing)"><select id="ractive"><option value="1">Active — can login</option><option value="0">Inactive — login blocked</option></select></div><button onclick="saveRider()">Save Rider</button></div><div class="card"><table><tr><th>Name</th><th>Phone</th><th>Access</th><th>GPS</th><th>Action</th></tr>${data.riders.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${r.active?'Active':'Inactive'}</td><td>${r.latitude??'--'}, ${r.longitude??'--'}<br>${r.last_seen||'No recent location'}</td><td><button class="smallbtn" onclick='editRider(${JSON.stringify(r).replaceAll("'","&#39;")})'>Edit</button> <button class="smallbtn secondary" onclick="toggleRider('${r.id}',${!r.active})">${r.active?'Disable':'Enable'}</button> <button class="smallbtn danger" onclick="delRider('${r.id}')">Delete</button></td></tr>`).join('')}</table></div>`;bindMediaPreview();}
function editRider(r){rn.value=r.name;rp.value=r.phone;rpass.value='';ractive.value=r.active?'1':'0';editRiderId=r.id;window.scrollTo({top:0,behavior:'smooth'})}
async function saveRider(){const body={id:editRiderId,name:rn.value,phone:rp.value,active:ractive.value==='1'};if(rpass.value)body.password=rpass.value;else if(!editRiderId)body.password='ChangeMe123!';await api(editRiderId?'/api/admin/riders/'+editRiderId:'/api/admin/riders',{method:editRiderId?'PATCH':'POST',body:JSON.stringify(body)});editRiderId=null;await load()}
async function toggleRider(id,active){await api('/api/admin/riders/'+id,{method:'PATCH',body:JSON.stringify({active})});await load()}
async function delRider(id){if(confirm('Delete rider? Assigned orders will become unassigned.')){await api('/api/admin/riders/'+id,{method:'DELETE'});await load()}}
function referrals(){document.getElementById('panel').innerHTML=`<div class="card"><h2>Referral Control</h2><p class="muted">Approve/reward, reject or keep referrals pending. Reward amount follows the recorded event amount.</p><table><tr><th>Referrer</th><th>Referred</th><th>Reward</th><th>Status</th><th>Action</th></tr>${(data.referrals||[]).map(r=>`<tr><td>${esc(r.referrerName)}<br>${esc(r.referrerPhone)}</td><td>${esc(r.referred_name||'')}</td><td>₹${r.rewardAmount}</td><td>${esc(r.status)}</td><td><button class="smallbtn green" onclick="refStatus('${r.id}','rewarded')">Reward</button> <button class="smallbtn secondary" onclick="refStatus('${r.id}','pending')">Pending</button> <button class="smallbtn danger" onclick="refStatus('${r.id}','rejected')">Reject</button></td></tr>`).join('')}</table></div>`;bindMediaPreview();}
async function refStatus(id,status){await api('/api/admin/referrals/'+id,{method:'PATCH',body:JSON.stringify({status})});await load()}
if(key)load();
