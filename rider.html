<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b98117"><title>MI EXPRESS BIRYANI · Rider</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f1e4;color:#28190b}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #eadfc8;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 6px 18px #0000000b}input,select,button{width:100%;padding:13px;margin:6px 0;border-radius:11px;border:1px solid #dfd1b7;font-size:15px}button{border:0;background:#b98117;color:#fff;font-weight:900}.login-title{font-size:28px;font-weight:900;margin:8px 0}.muted{color:#786e60}.dash{display:none}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.user{font-weight:900}.logout{width:auto;background:#eee2cc;color:#5d410f;padding:9px 12px}.refresh-wrap{display:flex;align-items:center;justify-content:center;margin:10px 0 4px}.refresh{width:72px;height:72px;border-radius:50%;font-size:34px;padding:0;box-shadow:0 6px 18px #0002;transition:transform .35s}.refresh.flash{animation:spinflash .55s ease}@keyframes spinflash{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}.order{border:1px solid #eadfc8;border-radius:16px;padding:14px;margin:10px 0;background:#fff}.order-head{display:flex;justify-content:space-between;gap:8px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1cf;font-weight:800;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.call{background:#087b4d}.map{background:#315f9b}.loc{background:#5b3c9b}.order select{margin-top:8px}.gps{font-size:12px;color:#786e60}.empty{text-align:center;padding:30px;color:#786e60}.error{color:#a53127;font-weight:700}@media(max-width:480px){.actions{grid-template-columns:1fr}.refresh{width:68px;height:68px}}
</style></head><body><div class="wrap">
<div id="login" class="card"><div class="login-title">🛵 MI EXPRESS BIRYANI</div><p class="muted">Rider Login</p><input id="phone" inputmode="numeric" autocomplete="username" placeholder="User ID / Mobile Number"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><button onclick="login()">LOGIN</button><div id="msg" class="error"></div></div>
<div id="app" class="dash"><div class="card"><div class="topbar"><div><div class="user" id="me">Rider</div><div class="muted" id="gpsState">GPS: not shared</div></div><button class="logout" onclick="logout()">Logout</button></div></div>
<div class="refresh-wrap"><button id="refreshBtn" class="refresh" title="Refresh orders" onclick="manualRefresh()">↻</button></div><div style="text-align:center;font-weight:900">Orders</div><div id="orders"></div></div></div>
<script>
let token=localStorage.getItem('mebRiderToken')||'',refreshing=false,autoTimer=null,watchId=null;
async function api(u,o={}){o.headers={...(o.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){const p=phone.value.trim(),pw=pass.value;if(!p||!pw){msg.textContent='Mobile number and password are required';return}fetch('/api/rider/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:p,password:pw})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('mebRiderToken',token);showApp(d.rider);await loadOrders()}).catch(e=>msg.textContent=e.message)}
function showApp(r){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';me.textContent=(r.name||'Rider')+' · '+(r.phone||'');}
function logout(){localStorage.removeItem('mebRiderToken');token='';clearInterval(autoTimer);if(watchId!==null)navigator.geolocation?.clearWatch(watchId);location.reload()}
async function loadOrders(){if(refreshing)return;refreshing=true;try{const os=await api('/api/rider/orders');orders.innerHTML=os.map(renderOrder).join('')||'<div class="card empty">No active assigned orders.</div>';const m=await api('/api/rider/me');gpsState.textContent=m.lastSeen?'GPS: last shared '+new Date(m.lastSeen).toLocaleTimeString('en-IN'):'GPS: not shared';}catch(e){if(/Authentication/i.test(e.message)){logout();return}orders.innerHTML='<div class="card error">'+escapeHtml(e.message)+'</div>'}finally{refreshing=false}}
function renderOrder(o){const map=o.latitude!=null&&o.longitude!=null?`https://www.google.com/maps/dir/?api=1&destination=${o.latitude},${o.longitude}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address||'')}`;return `<div class="order"><div class="order-head"><b>#${escapeHtml(o.id)}</b><span class="status">${escapeHtml(o.status)}</span></div><p><b>${escapeHtml(o.name)}</b><br>📞 ${escapeHtml(o.phone)}<br>📍 ${escapeHtml(o.address)}</p><p>₹${Number(o.total||0)} · ${escapeHtml(o.paymentMethod||'COD')}</p><div class="actions"><a class="buttonLink call" href="tel:${escapeHtml(o.phone)}" style="text-decoration:none;color:#fff;text-align:center;padding:13px;border-radius:11px;font-weight:900">📞 Live Call</a><a class="buttonLink map" href="${map}" target="_blank" rel="noopener" style="text-decoration:none;color:#fff;text-align:center;padding:13px;border-radius:11px;font-weight:900">🗺️ Track / Navigate</a></div><button class="loc" onclick="shareLocation()">📍 Share Live Location</button><select id="s_${escapeHtml(o.id)}"><option value="${escapeHtml(o.status)}">${escapeHtml(o.status)}</option><option>Confirmed</option><option>Preparing</option><option>Ready for Pickup</option><option>Out for Delivery</option><option>Delivered</option></select><button onclick="updateStatus('${escapeHtml(o.id)}')">Update Order Status</button></div>`}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function updateStatus(id){try{await api('/api/rider/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status:document.getElementById('s_'+id).value})});await loadOrders()}catch(e){alert(e.message)}}
async function manualRefresh(){const b=document.getElementById('refreshBtn');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');await loadOrders()}
function startLiveLocation(){if(!navigator.geolocation||watchId!==null)return;watchId=navigator.geolocation.watchPosition(async p=>{try{await api('/api/rider/location',{method:'POST',body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude})});gpsState.textContent='GPS: live · '+new Date().toLocaleTimeString('en-IN')}catch(e){}},()=>{gpsState.textContent='GPS: permission needed'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
async function shareLocation(){if(!navigator.geolocation){alert('GPS not supported');return}navigator.geolocation.getCurrentPosition(async p=>{try{await api('/api/rider/location',{method:'POST',body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude})});gpsState.textContent='GPS: location shared '+new Date().toLocaleTimeString('en-IN');await loadOrders()}catch(e){alert(e.message)}},()=>alert('Location permission is required'),{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
async function boot(){if(!token)return;try{const r=await api('/api/rider/me');showApp(r);await loadOrders();startLiveLocation();autoTimer=setInterval(loadOrders,15000)}catch(e){localStorage.removeItem('mebRiderToken');token=''}}boot();
</script></body></html>
