<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI EXPRESS BIRYANI · Rider</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f1e4;color:#28190b}.wrap{max-width:700px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #eadfc8;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 6px 18px #0000000b}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #dfd1b7}button{border:0;background:#b98117;color:#fff;font-weight:900}.order{border:1px solid #eadfc8;border-radius:14px;padding:12px;margin:10px 0}.green{background:#087b4d}.danger{background:#a53127}</style></head><body><div class="wrap"><h2>🛵 MI EXPRESS BIRYANI · Rider</h2><div id="login" class="card"><input id="phone" placeholder="Rider phone"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="msg"></div></div><div id="app" style="display:none"><div class="card"><b id="me"></b><button class="green" onclick="shareLocation()">📍 Share Current Location</button><button onclick="loadOrders()">Refresh Orders</button></div><div id="orders"></div></div></div><script>let token=localStorage.getItem('mebRiderToken')||'';async function api(u,o={}){o.headers={...(o.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{const r=await fetch('/api/rider/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:phone.value,password:pass.value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem('mebRiderToken',token);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';me.textContent=d.rider.name+' · '+d.rider.phone;loadOrders()}catch(e){msg.textContent=e.message}}async function loadOrders(){try{const os=await api('/api/rider/orders');orders.innerHTML=os.map(o=>`<div class="order"><b>#${o.id}</b><p>${o.name} · ${o.phone}<br>${o.address}</p><p>₹${o.total} · ${o.paymentMethod} · ${o.status}</p><select id="s_${o.id}"><option>${o.status}</option><option>Confirmed</option><option>Preparing</option><option>Ready for Pickup</option><option>Out for Delivery</option><option>Delivered</option></select><button onclick="updateStatus('${o.id}')">Update Status</button></div>`).join('')||'<div class="card">No active assigned orders.</div>'}catch(e){if(e.message.includes('Authentication'))location.reload();else orders.innerHTML='<div class="card">'+e.message+'</div>'}}async function updateStatus(id){await api('/api/rider/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:document.getElementById('s_'+id).value})});loadOrders()}async function shareLocation(){if(!navigator.geolocation)return alert('GPS not supported');navigator.geolocation.getCurrentPosition(async p=>{await api('/api/rider/location',{method:'POST',body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude})});alert('Location updated')},e=>alert('Location permission required'),{enableHighAccuracy:true,maximumAge:10000,timeout:15000})}if(token){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';api('/api/rider/me').then(x=>{me.textContent=x.name+' · '+x.phone;loadOrders()}).catch(()=>localStorage.removeItem('mebRiderToken'))}</script></body></html>
