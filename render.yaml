services:
  - type: web
    name: mi-express-biryani
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/mi-express-biryani.db
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OTP_PROVIDER
        value: 2factor
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOFACTOR_TEMPLATE_NAME
        value: LOGIN_OTP
      - key: TWOFACTOR_OTP_URL
        value: https://2factor.in/API/V1/OTP/SEND
      - key: ENABLE_ONLINE_PAYMENTS
        value: "false"
      - key: ALLOW_DEV_OTP
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
