services:
  - type: web
    name: mi-express-biryani
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false
